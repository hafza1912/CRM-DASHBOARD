<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Enterprise CRM Dashboard</title>
<style>
/* --- CSS VARIABLES (Light & Dark Mode) --- */
:root {
  --bg-color: #f4f7f6; --text-main: #333333; --text-muted: #7f8c8d;
  --card-bg: #ffffff; --border-color: #dddddd; --table-hover: #f9fbfb;
  --input-bg: #ffffff; --kpi-title: #2c3e50; --primary-color: #3498db;
  --primary-hover: #2980b9; --error-bg: #ffeaea; --error-text: #e74c3c;
  --success-bg: #d4edda; --success-text: #155724; --shadow: rgba(0, 0, 0, 0.08);
}
body.dark-mode {
  --bg-color: #121212; --text-main: #e0e0e0; --text-muted: #a0a0a0;
  --card-bg: #1e1e1e; --border-color: #333333; --table-hover: #2a2a2a;
  --input-bg: #2d2d2d; --kpi-title: #ffffff; --shadow: rgba(0, 0, 0, 0.4);
}

/* --- RESET & BASE STYLES --- */
* { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Tahoma, sans-serif; }
body { background-color: var(--bg-color); color: var(--text-main); transition: 0.3s; min-height: 100vh; }

/* --- SHARED LAYOUT & CARDS --- */
.login-wrapper { display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 1rem; }
.dashboard-wrapper { max-width: 1200px; margin: 0 auto; padding: 2rem; }
.login-card, .kpi-card, .add-client-card, .table-container { background: var(--card-bg); border-radius: 8px; box-shadow: 0 4px 15px var(--shadow); }

/* --- LOGIN SPECIFIC STYLES --- */
.login-card { width: 100%; max-width: 400px; padding: 2.5rem; position: relative; }
.login-header { text-align: center; margin-bottom: 2rem; }
.login-header h1 { font-size: 1.8rem; color: var(--primary-color); margin-bottom: 0.5rem; }
.login-header p { color: var(--text-muted); font-size: 0.95rem; }
.form-group { margin-bottom: 1.25rem; }
.form-group label { display: block; margin-bottom: 0.5rem; font-size: 0.9rem; font-weight: 600; }
.message-box { display: none; padding: 0.75rem; border-radius: 6px; margin-bottom: 1.5rem; font-size: 0.9rem; text-align: center; font-weight: 600; }
.message-box.error { display: block; background: var(--error-bg); color: var(--error-text); border: 1px solid #ffcece; }
.message-box.success { display: block; background: var(--success-bg); color: var(--success-text); border: 1px solid #c3e6cb; }

/* --- DASHBOARD SPECIFIC STYLES --- */
.header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 2rem; }
.header h1 { font-size: 1.8rem; color: var(--kpi-title); }
.header p { color: var(--text-muted); }
.kpi-grid { display: flex; gap: 1.5rem; margin-bottom: 2rem; }
.kpi-card { padding: 1.5rem; flex: 1; border-left: 5px solid var(--primary-color); }
.kpi-card h3 { font-size: 0.9rem; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.5px; }
.kpi-value { font-size: 2rem; font-weight: bold; color: var(--kpi-title); margin-top: 0.5rem; }
.add-client-card { padding: 1.5rem; margin-bottom: 2rem; }
.add-client-card h3 { margin-bottom: 1rem; font-size: 1.1rem; color: var(--kpi-title); }
.inline-form, .controls { display: flex; flex-wrap: wrap; gap: 1rem; }
.controls { margin-bottom: 1.5rem; }

/* --- SHARED COMPONENTS (Inputs & Buttons) --- */
input, select { flex: 1; min-width: 150px; width: 100%; padding: 0.75rem; border: 1px solid var(--border-color); background: var(--input-bg); color: var(--text-main); border-radius: 6px; font-size: 1rem; outline: none; }
input:focus, select:focus { border-color: var(--primary-color); }
button { cursor: pointer; border: none; border-radius: 6px; font-size: 0.9rem; font-weight: 600; transition: 0.2s; }
.btn-primary { width: 100%; padding: 0.85rem; background: var(--primary-color); color: white; margin-top: 1rem; }
.btn-primary:hover { background: var(--primary-hover); }
.btn-primary:disabled { background: var(--text-muted); cursor: not-allowed; }
.btn-danger { padding: 0.4rem 0.8rem; background: var(--error-bg); color: var(--error-text); border: 1px solid #ffcece; }
.btn-danger:hover { background: var(--error-text); color: white; }
.btn-outline { padding: 0.5rem 1rem; background: transparent; border: 1px solid var(--border-color); color: var(--text-main); }
.btn-outline:hover { background: var(--card-bg); border-color: var(--primary-color); }
.theme-toggle-absolute { position: absolute; top: 1rem; right: 1rem; background: transparent; font-size: 1.2rem; border: none; }

/* Table & Badges */
table { width: 100%; border-collapse: collapse; }
th, td { padding: 1rem 1.5rem; text-align: left; border-bottom: 1px solid var(--border-color); }
th { background: var(--card-bg); font-weight: 600; color: var(--kpi-title); }
tr:hover { background: var(--table-hover); }
.badge { padding: 0.35rem 0.75rem; border-radius: 20px; font-size: 0.85rem; font-weight: 600; }
.badge.active { background: var(--success-bg); color: var(--success-text); }
.badge.pending { background: #fff3cd; color: #856404; }
.badge.closed { background: #e2e3e5; color: #383d41; }
</style>
</head>
<body>

  <!-- ================= LOGIN VIEW ================= -->
  <div id="login-view" class="login-wrapper">
    <div class="login-card">
      <button class="theme-toggle-btn theme-toggle-absolute">🌙</button>
      <div class="login-header">
        <h1>Welcome Back</h1>
        <p>Sign in to access your CRM Dashboard</p>
      </div>
      <div id="message-container" class="message-box"></div>
      <form id="login-form">
        <div class="form-group">
          <label for="email">Work Email</label>
          <input type="email" id="email" value="admin@company.com" required>
        </div>
        <div class="form-group">
          <label for="password">Password</label>
          <input type="password" id="password" value="password123" required>
        </div>
        <button type="submit" id="submit-btn" class="btn-primary">Sign In</button>
      </form>
    </div>
  </div>

  <!-- ================= DASHBOARD VIEW (Hidden by default) ================= -->
  <div id="dashboard-view" class="dashboard-wrapper" style="display: none;">
    <header class="header">
      <div>
        <h1>Client Pipeline</h1>
        <p>Manage your enterprise accounts and track revenue.</p>
      </div>
      <button class="theme-toggle-btn btn-outline">🌙 Dark Mode</button>
    </header>

    <section class="kpi-grid">
      <div class="kpi-card">
        <h3>Visible Clients</h3>
        <p id="kpi-count" class="kpi-value">0</p>
      </div>
      <div class="kpi-card">
        <h3>Total Pipeline Value</h3>
        <p id="kpi-revenue" class="kpi-value">$0</p>
      </div>
    </section>

    <section class="add-client-card">
      <h3>Add New Client</h3>
      <form id="add-client-form" class="inline-form">
        <input type="text" id="new-company" placeholder="Company Name" required>
        <input type="text" id="new-contact" placeholder="Contact Name" required>
        <select id="new-status">
          <option value="Active">Active</option>
          <option value="Pending">Pending</option>
          <option value="Closed">Closed</option>
        </select>
        <input type="number" id="new-value" placeholder="Pipeline Value ($)" required min="0">
        <button type="submit" class="btn-primary" style="width: auto; margin-top: 0;">Add Client</button>
      </form>
    </section>

    <section class="controls">
      <input type="text" id="search-input" placeholder="Search by company name...">
      <select id="status-filter">
        <option value="All">All Statuses</option>
        <option value="Active">Active</option>
        <option value="Pending">Pending</option>
        <option value="Closed">Closed</option>
      </select>
    </section>

    <section class="table-container">
      <table>
        <thead>
          <tr>
            <th>Company</th>
            <th>Contact Name</th>
            <th>Status</th>
            <th>Pipeline Value</th>
            <th>Actions</th>
          </tr>
        </thead>
        <tbody id="table-body">
          <!-- JS injects rows here -->
        </tbody>
      </table>
    </section>
  </div>

  <!-- ================= JAVASCRIPT ================= -->
  <script>
    // --- 1. DARK MODE LOGIC ---
    const themeButtons = document.querySelectorAll('.theme-toggle-btn');

    function applyTheme() {
      if (localStorage.getItem('theme') === 'dark') {
        document.body.classList.add('dark-mode');
        themeButtons.forEach(btn => btn.textContent = btn.classList.contains('theme-toggle-absolute') ? '☀️' : '☀️ Light Mode');
      } else {
        document.body.classList.remove('dark-mode');
        themeButtons.forEach(btn => btn.textContent = btn.classList.contains('theme-toggle-absolute') ? '🌙' : '🌙 Dark Mode');
      }
    }

    themeButtons.forEach(btn => {
      btn.addEventListener('click', () => {
        const newTheme = document.body.classList.contains('dark-mode') ? 'light' : 'dark';
        localStorage.setItem('theme', newTheme);
        applyTheme();
      });
    });

    applyTheme(); // Init theme on load

    // --- 2. LOGIN LOGIC ---
    const loginView = document.getElementById('login-view');
    const dashboardView = document.getElementById('dashboard-view');
    const loginForm = document.getElementById('login-form');
    const emailInput = document.getElementById('email');
    const passwordInput = document.getElementById('password');
    const submitBtn = document.getElementById('submit-btn');
    const messageContainer = document.getElementById('message-container');

    function showMessage(type, text) {
      messageContainer.textContent = text;
      messageContainer.className = `message-box ${type}`;
    }

    loginForm.addEventListener('submit', function(event) {
      event.preventDefault();
      const email = emailInput.value.trim();
      const password = passwordInput.value.trim();

      submitBtn.disabled = true;
      submitBtn.textContent = 'Authenticating...';
      showMessage('', '');

      setTimeout(() => {
        if (email === 'admin@company.com' && password === 'password123') {
          showMessage('success', 'Authentication successful!');
          
          setTimeout(() => {
            // Switch views instead of redirecting
            loginView.style.display = 'none';
            dashboardView.style.display = 'block';
            renderTable(clients); // Load table data
          }, 600);

        } else {
          showMessage('error', 'Invalid email or password. Try admin@company.com / password123');
          submitBtn.disabled = false;
          submitBtn.textContent = 'Sign In';
        }
      }, 800);
    });

    // --- 3. DASHBOARD LOGIC ---
    let clients = [
      { id: 1, company: "Acme Corp", contact: "Alice Smith", status: "Active", value: 15000 },
      { id: 2, company: "TechFlow Solutions", contact: "Bob Jones", status: "Pending", value: 8500 },
      { id: 3, company: "GlobalNet", contact: "Carol White", status: "Closed", value: 0 },
      { id: 4, company: "DataSync Inc", contact: "David Brown", status: "Active", value: 22000 }
    ];

    const tableBody = document.getElementById('table-body');
    const searchInput = document.getElementById('search-input');
    const statusFilter = document.getElementById('status-filter');
    const kpiCount = document.getElementById('kpi-count');
    const kpiRevenue = document.getElementById('kpi-revenue');
    const addClientForm = document.getElementById('add-client-form');

    const formatCurrency = (number) => new Intl.NumberFormat('en-US', { style: 'currency', currency: 'USD', maximumFractionDigits: 0 }).format(number);

    function renderTable(dataArray) {
      tableBody.innerHTML = "";
      dataArray.forEach(client => {
        const row = document.createElement('tr');
        row.innerHTML = `
          <td><strong>${client.company}</strong></td>
          <td>${client.contact}</td>
          <td><span class="badge ${client.status.toLowerCase()}">${client.status}</span></td>
          <td>${formatCurrency(client.value)}</td>
          <td><button class="btn-danger" onclick="deleteClient(${client.id})">Delete</button></td>
        `;
        tableBody.appendChild(row);
      });
      updateKPIs(dataArray);
    }

    function updateKPIs(dataArray) {
      kpiCount.textContent = dataArray.length;
      const totalRevenue = dataArray.reduce((sum, client) => sum + client.value, 0);
      kpiRevenue.textContent = formatCurrency(totalRevenue);
    }

    function filterData() {
      const searchTerm = searchInput.value.toLowerCase();
      const statusTerm = statusFilter.value;
      const filteredClients = clients.filter(client => {
        const matchesSearch = client.company.toLowerCase().includes(searchTerm);
        const matchesStatus = statusTerm === "All" || client.status === statusTerm;
        return matchesSearch && matchesStatus;
      });
      renderTable(filteredClients);
    }

    function handleAddClient(event) {
      event.preventDefault(); 
      const newClient = {
        id: Date.now(),
        company: document.getElementById('new-company').value,
        contact: document.getElementById('new-contact').value,
        status: document.getElementById('new-status').value,
        value: parseFloat(document.getElementById('new-value').value)
      };
      clients.push(newClient);
      addClientForm.reset();
      filterData();
    }

    // Expose deleteClient to global scope for inline onclick handler
    window.deleteClient = function(idToDelete) {
      clients = clients.filter(client => client.id !== idToDelete);
      filterData();
    };

    searchInput.addEventListener('input', filterData);
    statusFilter.addEventListener('change', filterData);
    addClientForm.addEventListener('submit', handleAddClient);
  </script>
</body>
</html>
