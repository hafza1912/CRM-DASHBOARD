<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Enterprise CRM Dashboard</title>
<style>
  /* =========================================
     CSS SECTION: Styling the page
     ========================================= */
     
  /* Basic Reset: Removes default browser spacing and makes sizing predictable */
  * { 
    margin: 0; 
    padding: 0; 
    box-sizing: border-box; 
    font-family: Arial, sans-serif; 
  }
  
  /* Set the default background and text color for the whole page */
  body { 
    background-color: #f4f4f4; 
    color: #333; 
  }

  /* --- DARK MODE LOGIC --- */
  /* When the 'dark-mode' class is added to the <body> via JavaScript, 
     these styles will overwrite the default ones above. */
  body.dark-mode { background-color: #222; color: #eee; }
  body.dark-mode .card, 
  body.dark-mode table th { background-color: #333; color: #eee; border-color: #555; }
  body.dark-mode input, 
  body.dark-mode select { background-color: #444; color: #eee; border-color: #666; }
  body.dark-mode td { border-bottom: 1px solid #555; }

  /* --- LAYOUT WRAPPERS --- */
  /* Centers the login box perfectly in the middle of the screen */
  .login-wrapper { display: flex; justify-content: center; align-items: center; height: 100vh; }
  
  /* Restricts the dashboard width so it doesn't stretch too far on huge monitors */
  .dashboard-wrapper { max-width: 1000px; margin: 20px auto; padding: 20px; }
  
  /* Simple card styling to group content together with a border */
  .card { 
    background: white; 
    border: 1px solid #ccc; 
    border-radius: 4px; 
    padding: 20px; 
    margin-bottom: 20px; 
  }

  /* --- LOGIN SCREEN STYLES --- */
  .login-box { width: 350px; text-align: center; }
  .login-box h1 { margin-bottom: 20px; font-size: 24px; }
  .form-group { margin-bottom: 15px; text-align: left; }
  .form-group label { display: block; margin-bottom: 5px; font-weight: bold; }
  
  /* --- INPUTS & BUTTONS --- */
  input, select { 
    width: 100%; 
    padding: 10px; 
    border: 1px solid #ccc; 
    border-radius: 3px; 
    margin-bottom: 10px;
  }
  
  button { 
    padding: 10px 15px; 
    border: none; 
    border-radius: 3px; 
    cursor: pointer; 
    font-weight: bold; 
  }
  
  .btn-primary { background-color: #007bff; color: white; width: 100%; }
  .btn-primary:hover { background-color: #0056b3; }
  
  .btn-danger { background-color: #dc3545; color: white; }
  .btn-danger:hover { background-color: #a71d2a; }
  
  .btn-toggle { background-color: #6c757d; color: white; margin-bottom: 20px; }

  /* --- ALERT MESSAGE BOX (Hidden by default) --- */
  #message-box { display: none; padding: 10px; margin-bottom: 15px; border-radius: 3px; }
  .error-msg { background-color: #f8d7da; color: #721c24; border: 1px solid #f5c6cb; }

  /* --- DASHBOARD STYLES --- */
  /* Flexbox makes elements sit side-by-side easily */
  .header-flex { display: flex; justify-content: space-between; align-items: center; }
  .kpi-container { display: flex; gap: 20px; }
  .kpi-box { flex: 1; border-left: 4px solid #007bff; }
  .kpi-box h3 { color: #666; font-size: 14px; margin-bottom: 5px; }
  body.dark-mode .kpi-box h3 { color: #aaa; }
  
  .inline-form { display: flex; gap: 10px; }
  .inline-form input, .inline-form select { margin-bottom: 0; }
  .inline-form button { width: auto; }

  /* --- TABLE STYLES --- */
  table { width: 100%; border-collapse: collapse; margin-top: 10px; }
  th, td { padding: 12px; text-align: left; border-bottom: 1px solid #ddd; }
  th { background-color: #f8f9fa; }
  
  /* Status tags (The colored bubbles) */
  .status { padding: 4px 8px; border-radius: 12px; font-size: 12px; font-weight: bold; }
  .status-active { background-color: #d4edda; color: #155724; }
  .status-pending { background-color: #fff3cd; color: #856404; }
  .status-closed { background-color: #e2e3e5; color: #383d41; }
</style>
</head>
<body>

  <!-- =========================================
       HTML SECTION 1: THE LOGIN VIEW
       This is visible when the page first loads.
       ========================================= -->
  <div id="login-view" class="login-wrapper">
    <div class="card login-box">
      <h1>CRM Login</h1>
      
      <!-- This empty div is used to show error messages (like wrong password) -->
      <div id="message-box"></div>
      
      <form id="login-form">
        <div class="form-group">
          <label>Email Address</label>
          <input type="email" id="email" value="admin@company.com" required>
        </div>
        <div class="form-group">
          <label>Password</label>
          <input type="password" id="password" value="password123" required>
        </div>
        <button type="submit" class="btn-primary">Login</button>
      </form>
    </div>
  </div>

  <!-- =========================================
       HTML SECTION 2: THE DASHBOARD VIEW
       Notice style="display: none;" - It stays completely hidden 
       until the JavaScript logs the user in.
       ========================================= -->
  <div id="dashboard-view" class="dashboard-wrapper" style="display: none;">
    <div class="header-flex">
      <h2>Sales Dashboard</h2>
      <button id="theme-toggle" class="btn-toggle">Dark Mode</button>
    </div>

    <!-- KPI Cards (Key Performance Indicators) -->
    <div class="kpi-container">
      <div class="card kpi-box">
        <h3>Total Clients</h3>
        <!-- JS will inject the count here -->
        <h2 id="kpi-count">0</h2> 
      </div>
      <div class="card kpi-box">
        <h3>Pipeline Value</h3>
        <!-- JS will inject the total money here -->
        <h2 id="kpi-revenue">$0</h2>
      </div>
    </div>

    <!-- Add Client Form -->
    <div class="card">
      <h3>Add New Lead</h3>
      <br>
      <form id="add-form" class="inline-form">
        <input type="text" id="add-company" placeholder="Company Name" required>
        <input type="text" id="add-contact" placeholder="Contact Person" required>
        <select id="add-status">
          <option value="Active">Active</option>
          <option value="Pending">Pending</option>
          <option value="Closed">Closed</option>
        </select>
        <input type="number" id="add-value" placeholder="Value ($)" required>
        <button type="submit" class="btn-primary">Add</button>
      </form>
    </div>

    <!-- Search Bar & Table -->
    <div class="card">
      <div class="inline-form" style="margin-bottom: 15px;">
        <!-- Search inputs trigger filtering instantly -->
        <input type="text" id="search-bar" placeholder="Search companies...">
        <select id="filter-status">
          <option value="All">All Statuses</option>
          <option value="Active">Active</option>
          <option value="Pending">Pending</option>
          <option value="Closed">Closed</option>
        </select>
      </div>

      <table>
        <thead>
          <tr>
            <th>Company</th>
            <th>Contact</th>
            <th>Status</th>
            <th>Value</th>
            <th>Action</th>
          </tr>
        </thead>
        <!-- The JS loop will create <tr> elements and put them inside here -->
        <tbody id="table-body">
        </tbody>
      </table>
    </div>
  </div>

  <!-- =========================================
       JAVASCRIPT SECTION: The Brains of the App
       ========================================= -->
  <script>
    /* ----------------------------------------------------
       PART 1: DARK MODE (Using Browser Local Storage)
       ---------------------------------------------------- */
    const themeBtn = document.getElementById('theme-toggle');
    
    // Check if the user previously saved 'dark' in their browser memory
    if (localStorage.getItem('theme') === 'dark') {
      document.body.classList.add('dark-mode'); // Turn it on instantly
    }

    // What happens when the user clicks the toggle button:
    themeBtn.addEventListener('click', function() {
      // Toggle means: "If it has the class, remove it. If it doesn't, add it."
      document.body.classList.toggle('dark-mode');
      
      // Save their choice for the next time they visit the site
      if (document.body.classList.contains('dark-mode')) {
        localStorage.setItem('theme', 'dark');
      } else {
        localStorage.setItem('theme', 'light');
      }
    });

    /* ----------------------------------------------------
       PART 2: SINGLE PAGE APP (SPA) LOGIN
       ---------------------------------------------------- */
    const loginForm = document.getElementById('login-form');
    const loginView = document.getElementById('login-view');
    const dashboardView = document.getElementById('dashboard-view');
    const msgBox = document.getElementById('message-box');

    loginForm.addEventListener('submit', function(e) {
      // INTERVIEW TIP: preventDefault() stops the form from refreshing the page!
      e.preventDefault(); 

      // Get the text the user typed
      const email = document.getElementById('email').value;
      const pass = document.getElementById('password').value;

      // Check credentials
      if (email === 'admin@company.com' && pass === 'password123') {
        // Hide login page, show dashboard page
        loginView.style.display = 'none';
        dashboardView.style.display = 'block';
        
        // Now that we are logged in, tell JS to draw the data table
        renderTable(clients); 
      } else {
        // Show error message
        msgBox.style.display = 'block';
        msgBox.className = 'error-msg';
        msgBox.innerText = 'Wrong email or password!';
      }
    });

    /* ----------------------------------------------------
       PART 3: DATA & TABLE RENDERING
       ---------------------------------------------------- */
    // This is our "Database" for the prototype. It's an array of Objects.
    let clients = [
      { id: 1, company: "Acme Corp", contact: "Alice Smith", status: "Active", value: 15000 },
      { id: 2, company: "TechFlow", contact: "Bob Jones", status: "Pending", value: 8500 },
      { id: 3, company: "GlobalNet", contact: "Carol White", status: "Closed", value: 0 }
    ];

    // Helper function: Turns 15000 into "$15,000"
    function formatMoney(amount) {
      return "$" + amount.toLocaleString();
    }

    // MAIN FUNCTION: Draws the table based on whatever array is passed into it
    function renderTable(data) {
      const tbody = document.getElementById('table-body');
      tbody.innerHTML = ""; // Clear out the old rows so we don't duplicate them

      // Loop over every client object in the array
      data.forEach(function(client) {
        
        // Figure out which CSS class to use for the colored badge
        let statusClass = "";
        if (client.status === "Active") statusClass = "status-active";
        if (client.status === "Pending") statusClass = "status-pending";
        if (client.status === "Closed") statusClass = "status-closed";

        // Create the HTML string for one row. We use backticks (`) to inject variables.
        const rowHTML = `
          <tr>
            <td><strong>${client.company}</strong></td>
            <td>${client.contact}</td>
            <td><span class="status ${statusClass}">${client.status}</span></td>
            <td>${formatMoney(client.value)}</td>
            
            <!-- Notice how we pass the client's unique ID into the delete function -->
            <td><button class="btn-danger" onclick="deleteClient(${client.id})">Delete</button></td>
          </tr>
        `;
        // Add this row to the table body
        tbody.innerHTML += rowHTML;
      });

      // Update the KPI numbers at the top of the dashboard
      updateMath(data);
    }

    /* ----------------------------------------------------
       PART 4: KPI CALCULATIONS (The Math)
       ---------------------------------------------------- */
    function updateMath(data) {
      // 1. Total Clients is simply the length of the array
      document.getElementById('kpi-count').innerText = data.length;
      
      // 2. Calculate Total Revenue using .reduce()
      // INTERVIEW TIP: Reduce loops through the array and keeps a running total ("sum").
      // The ", 0" at the end tells the math to start counting from zero.
      const total = data.reduce((sum, client) => sum + client.value, 0);
      
      // Display the final money
      document.getElementById('kpi-revenue').innerText = formatMoney(total);
    }

    /* ----------------------------------------------------
       PART 5: SEARCH AND FILTER LOGIC
       ---------------------------------------------------- */
    function runSearch() {
      // Grab what the user typed and make it lowercase so "acme" matches "Acme"
      const typedText = document.getElementById('search-bar').value.toLowerCase();
      const chosenStatus = document.getElementById('filter-status').value;

      // Use .filter() to create a brand new, smaller array of just the matches
      const results = clients.filter(function(client) {
        
        // Check if company name includes the search text
        const matchesName = client.company.toLowerCase().includes(typedText);
        
        // Check if the dropdown matches (or if "All" is selected)
        const matchesStatus = (chosenStatus === "All" || client.status === chosenStatus);
        
        // Keep this client ONLY if both conditions are true
        return matchesName && matchesStatus;
      });

      // Erase the old table and draw a new one using the filtered results
      renderTable(results);
    }

    // Trigger the search function every time the user types a letter or changes dropdown
    document.getElementById('search-bar').addEventListener('input', runSearch);
    document.getElementById('filter-status').addEventListener('change', runSearch);

    /* ----------------------------------------------------
       PART 6: ADD & DELETE CLIENTS (CRUD Operations)
       ---------------------------------------------------- */
    // Add Client
    document.getElementById('add-form').addEventListener('submit', function(e) {
      e.preventDefault(); // Stop page refresh

      // Create a brand new client object from the form inputs
      const newObj = {
        id: Date.now(), // Creates a unique number based on the current time
        company: document.getElementById('add-company').value,
        contact: document.getElementById('add-contact').value,
        status: document.getElementById('add-status').value,
        value: Number(document.getElementById('add-value').value) // Make sure it's a Number, not text
      };

      // Push the new object into our main database array
      clients.push(newObj);
      
      document.getElementById('add-form').reset(); // Clear the form fields
      runSearch(); // Re-run the search/filter to instantly redraw the screen
    });

    // Delete Client
    // This function is triggered by the inline onclick="" in the HTML table
    function deleteClient(id) {
      // Overwrite our main array with a filtered version that EXCLUDES the clicked ID
      clients = clients.filter(client => client.id !== id);
      
      runSearch(); // Redraw the screen to reflect the deletion
    }
  </script>
</body>
</html>
