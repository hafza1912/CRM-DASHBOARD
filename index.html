<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Enterprise CRM Dashboard</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="dashboard-container">
    <main class="main-content">
      <header class="header">
        <div class="header-titles">
          <h1>Client Pipeline</h1>
          <p>Manage your enterprise accounts and track revenue.</p>
        </div>
        <button id="theme-toggle" class="btn-outline">🌙 Dark Mode</button>
      </header>
      <!-- KPI Metrics -->
      <section class="kpi-grid">
        <div class="kpi-card">
          <h3>Visible Clients</h3>
          <p id="kpi-count" class="kpi-value">0</p>
        </div>
        <div class="kpi-card">
          <h3>Total Pipeline Value</h3>
          <p id="kpi-revenue" class="kpi-value">$0</p>
        </div>
      </section>
      <!-- Add New Client Form -->
      <section class="add-client-card">
        <h3>Add New Client</h3>
        <form id="add-client-form">
          <input type="text" id="new-company" placeholder="Company Name" required>
          <input type="text" id="new-contact" placeholder="Contact Name" required>
          <select id="new-status">
            <option value="Active">Active</option>
            <option value="Pending">Pending</option>
            <option value="Closed">Closed</option>
          </select>
          <input type="number" id="new-value" placeholder="Pipeline Value ($)" required min="0">
          <button type="submit" class="btn-primary">Add Client</button>
        </form>
      </section>
      <!-- Filters & Controls -->
      <section class="controls">
        <input type="text" id="search-input" placeholder="Search by company name...">
        <select id="status-filter">
          <option value="All">All Statuses</option>
          <option value="Active">Active</option>
          <option value="Pending">Pending</option>
          <option value="Closed">Closed</option>
        </select>
      </section>
      <!-- Data Table -->
      <section class="table-container">
        <table>
          <thead>
            <tr>
              <th>Company</th>
              <th>Contact Name</th>
              <th>Status</th>
              <th>Pipeline Value</th>
              <th>Actions</th>
            </tr>
          </thead>
          <tbody id="table-body">
            <!-- JavaScript will inject rows here -->
          </tbody>
        </table>
      </section>
    </main>
  </div>
  <script src="script.js"></script>
</body>
</html>
