<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Enterprise CRM Application</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- VIEW 1: LOGIN -->
  <div id="login-view" class="login-wrapper">
    <div class="login-card">
      <button class="theme-toggle-btn theme-toggle-absolute" aria-label="Toggle Dark Mode">🌙</button>
      <div class="login-header">
        <h1>Client Pipeline</h1>
        <p>Sign in to your CRM dashboard</p>
      </div>
      <div id="message-container" class="message-box"></div>
      <form id="login-form">
        <div class="form-group">
          <label for="email">Work Email</label>
          <input type="email" id="email" placeholder="admin@company.com" required>
        </div>
        <div class="form-group">
          <label for="password">Password</label>
          <input type="password" id="password" placeholder="••••••••" required>
        </div>
        <button type="submit" id="submit-btn" class="btn-primary">Sign In</button>
      </form>
    </div>
  </div>
  <!-- VIEW 2: CRM DASHBOARD (Hidden by default) -->
  <div id="dashboard-view" class="dashboard-wrapper" style="display: none;">
    <header class="header">
      <div>
        <h1>Client Pipeline</h1>
        <p>Manage your enterprise accounts and track revenue.</p>
      </div>
      <button class="theme-toggle-btn btn-outline">🌙 Dark Mode</button>
    </header>
    <section class="kpi-grid">
      <div class="kpi-card">
        <h3>Visible Clients</h3>
        <p id="kpi-count" class="kpi-value">0</p>
      </div>
      <div class="kpi-card">
        <h3>Total Pipeline Value</h3>
        <p id="kpi-revenue" class="kpi-value">$0</p>
      </div>
    </section>
    <section class="add-client-card">
      <h3>Add New Client</h3>
      <form id="add-client-form" class="inline-form">
        <input type="text" id="new-company" placeholder="Company Name" required>
        <input type="text" id="new-contact" placeholder="Contact Name" required>
        <select id="new-status">
          <option value="Active">Active</option>
          <option value="Pending">Pending</option>
          <option value="Closed">Closed</option>
        </select>
        <input type="number" id="new-value" placeholder="Pipeline Value ($)" required min="0">
        <button type="submit" class="btn-primary btn-inline">Add Client</button>
      </form>
    </section>
    <section class="controls">
      <input type="text" id="search-input" placeholder="Search by company name...">
      <select id="status-filter">
        <option value="All">All Statuses</option>
        <option value="Active">Active</option>
        <option value="Pending">Pending</option>
        <option value="Closed">Closed</option>
      </select>
    </section>
    <section class="table-container">
      <table>
        <thead>
          <tr>
            <th>Company</th>
            <th>Contact Name</th>
            <th>Status</th>
            <th>Pipeline Value</th>
            <th>Actions</th>
          </tr>
        </thead>
        <tbody id="table-body">
          <!-- JS injects rows here -->
        </tbody>
      </table>
    </section>
  </div>
  <script src="script.js"></script>
</body>
</html>
